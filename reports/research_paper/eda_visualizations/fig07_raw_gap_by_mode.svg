<path d="M122,144 H639.8836434282299 Q643.8836434282299,144 643.8836434282299,148 V162 Q643.8836434282299,166 639.8836434282299,166 H122 Z" fill="#2a78d6"/>
<text x="650.8836434282299" y="159.3" font-size="12" fill="#0b0b0b">1,323.8 days</text>
<text x="112" y="193.5" font-size="12.5" text-anchor="end" fill="#0b0b0b">Standard Class</text>
<path d="M122,178 H636.1384442950011 Q640.1384442950011,178 640.1384442950011,182 V196 Q640.1384442950011,200 636.1384442950011,200 H122 Z" fill="#2a78d6"/>
<text x="647.1384442950011" y="193.3" font-size="12" fill="#0b0b0b">1,314.3 days</text>
<text x="0" y="240" font-size="11" fill="#898781">Ship mode explains 0.12% of the variance of the raw gap.</text></svg>