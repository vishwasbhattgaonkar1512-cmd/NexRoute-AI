<svg xmlns="http://www.w3.org/2000/svg" width="760" height="252" viewBox="0 0 760 252" font-family='system-ui, -apple-system, "Segoe UI", Arial, sans-serif' role="img" aria-label="Figure 7. RAW gap (Ship Date − Order Date) by shipping mode, mean days">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="0" y="24" font-size="16.5" font-weight="600" fill="#0b0b0b">Figure 7. RAW gap (Ship Date − Order Date) by shipping mode, mean days</text>
<text x="0" y="45" font-size="12" fill="#52514e">The raw gap is 904–1,642 days for every mode; Same Day is not faster. It is not a lead time.</text>
<line x1="122" y1="70" x2="122" y2="206" stroke="#e1e0d9"/>
