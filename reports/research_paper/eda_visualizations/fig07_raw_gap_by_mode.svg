<text x="654.6682657102294" y="91.3" font-size="12" fill="#0b0b0b">1,333.4 days</text>
<text x="112" y="125.5" font-size="12.5" text-anchor="end" fill="#0b0b0b">First Class</text>
<path d="M122,110 H645.6 Q649.6,110 649.6,114 V128 Q649.6,132 645.6,132 H122 Z" fill="#2a78d6"/>
<text x="656.6" y="125.3" font-size="12" fill="#0b0b0b">1,338.3 days</text>
